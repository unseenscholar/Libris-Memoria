# libris-memoria.toml — Libris-Memoria canonical library database
#
# GENRE CODES
#   F=Fantasy  SF=Science Fiction  A=Adventure  Ch=Children's  Mg=Magic
#   CA=Coming-of-age  H=Horror  M=Mystery  T=Thriller  R=Romance
#   HF=Historical Fiction  NF=Non-Fiction
#
# STATUS CODES
#   r=read  re=reading  tr=to-read  ur=unreleased
#
# RATING FIELDS (all optional, scale 0–10)
#   r=book rating  ra=audiobook rating  rm=movie/adaptation rating
#
# UNRELEASED BOOKS
#   s="ur" requires at least one of: release=  release_audio=  (ISO date YYYY-MM-DD)

[series.hp]
title  = "Harry Potter"
