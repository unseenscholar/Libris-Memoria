  {n=2, t="Chamber of Secrets",     s="r", r=7},
  {n=3, t="Prisoner of Azkaban",    s="r"},
  {n=4, t="Goblet of Fire",         s="tr"},
  {n=5, t="Order of the Phoenix",   s="tr"},
  {n=6, t="Half-Blood Prince",      s="tr"},
  {n=7, t="Deathly Hallows",        s="tr"},
]

